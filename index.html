<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monteiro Barbershop | Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=PT+Serif:italic&display=swap" rel="stylesheet">
    <style>
        /* Reset básico */        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Remove fundo azul no toque mobile */
        }

        /* Estilo Geral - Estrito Black Style & Sem Scroll */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #212121;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Remove o scroll */
            position: fixed; /* Evita o "bounce" no iOS */
            display: flex;
            flex-direction: column; /* Organização vertical */
        }

        /* Container que centra os links e cabeçalho, com flex: 1 para empurrar rodapé */
        .page-content {
            display: flex;
            flex-direction: column;
            width: 100%;
            flex: 1; /* Ocupa o espaço central */
            max-width: 1400px;
            margin: 0 auto;
            justify-content: flex-end; /* Links para baixo dentro deste container */
            padding: 0 5vw 3vh 5vw; /* Margens responsivas */
        }

        /* Cabeçalho Monteiro */
        .header-monteiro {
            text-align: left;
            margin-bottom: 5vh; 
        }

        .header-monteiro h1 {
            font-weight: 700;
            text-transform: uppercase;
            font-size: clamp(2rem, 5vw, 2.5rem); 
            letter-spacing: 4px;
            margin: 0;
            line-height: 1;
        }

        .header-monteiro .barbershop {
            font-size: clamp(0.8rem, 2vw, 1rem);
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-top: 5px;
            color: #aaaaaa;
        }

        /* Área dos botões */
        .links-area {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* O item de link individual */
        .link-item {
            text-decoration: none;
            color: #ffffff;
            display: flex;
            align-items: flex-end;
            padding: 2.5vh 0; 
            position: relative;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        /* Linha base semi-transparente */
        .link-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Linha animada que preenche (PC e Touch) */
        .link-item::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: #ffffff;
            transform: scaleX(0); 
            transform-origin: left; 
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
        }

        /* Efeito de hover e toque */
        .link-item:hover,
        .link-item.active-anim {
            color: #e0e0e0;
        }

        .link-item:hover::before,
        .link-item.active-anim::before {
            transform: scaleX(1); /* Preenche a linha */
        }

        /* O texto principal */
        .item-main-text {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        /* O título do botão */
        .item-title {
            font-weight: 700;
            text-transform: uppercase;
            font-size: clamp(1.4rem, 4vw, 2.2rem); 
            letter-spacing: 1px;
            margin: 0;
            line-height: 1;
            transition: transform 0.3s ease;
        }

        /* Movimento subtil do texto */
        .link-item:hover .item-title,
        .link-item.active-anim .item-title {
            transform: translateX(5px);
        }

        /* O subtítulo do botão */
        .item-subtitle {
            text-transform: uppercase;
            font-size: clamp(0.65rem, 1.5vw, 0.8rem);
            letter-spacing: 2px;
            color: #aaaaaa;
            margin-top: 5px;
            margin-bottom: 0;
        }

        /* --- Área do Novo Logótipo Texturado (Rodapé) --- */
        .footer-logo-area {
            width: 100vw; /* Largura total do visor */
            background-color: #212121; /* Fundo preto para misturar */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0vh 0; /* Pequena margem acima/abaixo */
        }

        /* A imagem texturada é responsiva e de largura total */
        .full-logo {
            width: 100%;
            height: auto;
            max-width: 1400px; /* Limite opcional para não esticar demais em ecrãs gigantes */
            display: block;
            object-fit: contain; /* Mantém a proporção */
            margin: 20px 0px -20px 0px;
        }

        /* Copyright (Texto final) */
        .custom-footer {
            width: 100vw;
            text-align: center;
            font-size: 0.7rem;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 1vh 0; /* Margem vertical compacta */
            background-color: #212121;
        }

        /* Ajustes finos para ecrãs pequenos */
        @media (max-height: 650px) {
            .page-content { padding: 3vh 5vw; }
            .header-monteiro { margin-bottom: 3vh; }
            .footer-logo-area, .custom-footer { padding: 0.5vh 0; }
        }
    </style>
</head>
<body ontouchstart=""> <div class="page-content">

        <div class="header-monteiro">
            <h1>MONTEIRO</h1>
            <div class="barbershop">BARBERSHOP</div>
        </div>

        <div class="links-area">
            
            <a href="https://wa.me/351938362924" target="_blank" class="link-item">
                <div class="item-main-text">
                    <h2 class="item-title">WHATSAPP</h2>
                    <p class="item-subtitle">ENTRA EM CONTACTO CONNOSCO</p>
                </div>
            </a>

            <a href="https://noona.app/monteirobarbershop" target="_blank" class="link-item">
                <div class="item-main-text">
                    <h2 class="item-title">MARCAÇÕES ONLINE</h2>
                    <p class="item-subtitle">AGENDA O TEU CORTE SEM ESPERAS</p>
                </div>
            </a>

            <a href="https://www.google.com/maps/search/?api=1&query=Pra%C3%A7a%20Alm.%20Jaime%20Afreixo%205%20RC%203870-211%20Murtosa" target="_blank" class="link-item">
                <div class="item-main-text">
                    <h2 class="item-title">LOCALIZAÇÃO</h2>
                    <p class="item-subtitle">Vê NO MAPA / OBTER DIREÇÕES</p>
                </div>
            </a>

        </div>
<div class="custom-footer">
        © 2026 MONTEIRO BARBERSHOP..
    </div>
    </div> <div class="footer-logo-area">
        <img src="https://lh3.googleusercontent.com/u/0/d/1uCA7txz02rN1-rGvexbvIPV4ApsA0kFh" alt="Logótipo Monteiro Blackmetal-Style" class="full-logo">
    </div>

    

    <script>
        document.querySelectorAll('.link-item').forEach(item => {
            // No toque, inicia a animação
            item.addEventListener('touchstart', function() {
                this.classList.add('active-anim');
            }, {passive: true});

            // No fim do toque, remove a classe após delay
            item.addEventListener('touchend', function() {
                setTimeout(() => {
                    this.classList.remove('active-anim');
                }, 500); 
            }, {passive: true});

            // Se o toque for cancelado
            item.addEventListener('touchcancel', function() {
                this.classList.remove('active-anim');
            }, {passive: true});
        });
    </script>

</body>
</html>
