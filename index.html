    <style>
        /* Reset básico */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Remove fundo azul no toque mobile */
        }

        /* Estilo Geral - Estrito Black Style & Sem Scroll */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #212121;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Remove o scroll */
            position: fixed; /* Evita o "bounce" no iOS */
            display: flex;
            flex-direction: column; /* Organização vertical */
        }

        /* Container que centra os links e cabeçalho, com flex: 1 para empurrar rodapé */
        .page-content {
            display: flex;
            flex-direction: column;
            width: 100%;
            flex: 1; /* Ocupa o espaço central */
            max-width: 1400px;
            margin: 0 auto;
            justify-content: flex-end; /* Links para baixo dentro deste container */
            padding: 0 5vw 3vh 5vw; /* Margens responsivas */
        }

        /* --- Novo Container do Logo SVG --- */
        .logo-container {
            display: flex;
            justify-content: center; /* Centra horizontalmente */
            align-items: center;
            width: 100%;
            margin-bottom: 5vh; /* Espaço entre o logo e os links */
        }

        /* Torna o SVG responsivo */
        .logo-container svg {
            width: 45vw; /* Ocupa 45% da largura do ecrã em mobile */
            max-width: 220px; /* Limite máximo para não ficar gigante no PC */
            min-width: 140px; /* Limite mínimo para ecrãs muito pequenos */
            height: auto; /* Mantém a proporção correta */
        }

        /* Área dos botões */
        .links-area {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* O item de link individual */
        .link-item {
            text-decoration: none;
            color: #ffffff;
            display: flex;
            align-items: flex-end;
            padding: 2.5vh 0; 
            position: relative;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        /* Linha base semi-transparente */
        .link-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Linha animada que preenche (PC e Touch) */
        .link-item::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: #ffffff;
            transform: scaleX(0); 
            transform-origin: left; 
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
        }

        /* Efeito de hover e toque */
        .link-item:hover,
        .link-item.active-anim {
            color: #e0e0e0;
        }

        .link-item:hover::before,
        .link-item.active-anim::before {
            transform: scaleX(1); /* Preenche a linha */
        }

        /* O texto principal */
        .item-main-text {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        /* O título do botão */
        .item-title {
            font-weight: 700;
            text-transform: uppercase;
            font-size: clamp(1.4rem, 4vw, 2.2rem); 
            letter-spacing: 1px;
            margin: 0;
            line-height: 1;
            transition: transform 0.3s ease;
        }

        /* Movimento subtil do texto */
        .link-item:hover .item-title,
        .link-item.active-anim .item-title {
            transform: translateX(5px);
        }

        /* O subtítulo do botão */
        .item-subtitle {
            text-transform: uppercase;
            font-size: clamp(0.65rem, 1.5vw, 0.8rem);
            letter-spacing: 2px;
            color: #aaaaaa;
            margin-top: 5px;
            margin-bottom: 0;
        }

        /* --- Área do Logótipo Texturado (Rodapé) --- */
        .footer-logo-area {
            width: 100vw; /* Largura total do visor */
            background-color: #212121; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1vh 0; 
        }

        .full-logo {
            width: 100%;
            height: auto;
            max-width: 1400px; 
            display: block;
            object-fit: contain; 
        }

        /* Copyright (Texto final) */
        .custom-footer {
            width: 100vw;
            text-align: center;
            font-size: 0.7rem;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 1vh 0; 
            background-color: #0d0d0d;
        }

        /* Ajustes finos para ecrãs pequenos (ex: iPhone SE) */
        @media (max-height: 650px) {
            .page-content { padding: 3vh 5vw; }
            .logo-container { margin-bottom: 3vh; }
            .logo-container svg { max-width: 160px; } /* Reduz um pouco mais o logo em ecrãs baixos */
            .footer-logo-area, .custom-footer { padding: 0.5vh 0; }
        }
    </style>
