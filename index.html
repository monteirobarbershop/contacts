    <style>
        /* Reset básico */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Estilo Geral */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #212121;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            display: flex;
            flex-direction: column;
        }

        .page-content {
            display: flex;
            flex-direction: column;
            width: 100%;
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            justify-content: flex-end;
            padding: 0 5vw 3vh 5vw;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 5vh;
        }

        .logo-container svg {
            width: 45vw;
            max-width: 220px;
            min-width: 140px;
            height: auto;
        }

        .links-area {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .link-item {
            text-decoration: none;
            color: #ffffff;
            display: flex;
            align-items: flex-end;
            padding: 2.5vh 0; 
            position: relative;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .link-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.2);
        }

        .link-item::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: #ffffff;
            transform: scaleX(0); 
            transform-origin: left; 
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
        }

        .link-item:hover, .link-item.active-anim { color: #e0e0e0; }
        .link-item:hover::before, .link-item.active-anim::before { transform: scaleX(1); }

        .item-main-text { display: flex; flex-direction: column; flex-grow: 1; }
        .item-title {
            font-weight: 700;
            text-transform: uppercase;
            font-size: clamp(1.4rem, 4vw, 2.2rem); 
            letter-spacing: 1px;
            margin: 0;
            line-height: 1;
            transition: transform 0.3s ease;
        }

        .link-item:hover .item-title, .link-item.active-anim .item-title { transform: translateX(5px); }

        .item-subtitle {
            text-transform: uppercase;
            font-size: clamp(0.65rem, 1.5vw, 0.8rem);
            letter-spacing: 2px;
            color: #aaaaaa;
            margin-top: 5px;
            margin-bottom: 0;
        }

        .footer-logo-area {
            width: 100vw;
            background-color: #212121; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1vh 0; 
        }

        .full-logo {
            width: 100%;
            height: auto;
            max-width: 1400px; 
            display: block;
            object-fit: contain; 
        }

        .custom-footer {
            width: 100vw;
            text-align: center;
            font-size: 0.7rem;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 1vh 0; 
            background-color: #0d0d0d;
        }

        /* --- ESTILOS DO POPUP (MODAL) CORRIGIDOS --- */
        .modal-overlay {
            display: none; /* Escondido por padrão */
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
        }

        .modal-content {
            position: relative;
            margin: 5vh auto;
            width: 90%;
            height: 85vh;
            max-width: 600px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
            z-index: 10002;
        }

        /* Iframe para o PDF */
        #pdfViewer {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-height: 650px) {
            .page-content { padding: 3vh 5vw; }
            .logo-container { margin-bottom: 3vh; }
            .logo-container svg { max-width: 160px; }
            .footer-logo-area, .custom-footer { padding: 0.5vh 0; }
        }
    </style>
</head>

    <script>
        // Funções do Popup
        function abrirHorario() {
            document.getElementById("modalHorario").style.display = "block";
        }
        function fecharHorario() {
            document.getElementById("modalHorario").style.display = "none";
        }

        // Animações de toque para todos os links
        document.querySelectorAll('.link-item').forEach(item => {
            item.addEventListener('touchstart', function() {
                this.classList.add('active-anim');
            }, {passive: true});

            item.addEventListener('touchend', function() {
                setTimeout(() => { this.classList.remove('active-anim'); }, 500); 
            }, {passive: true});

            item.addEventListener('touchcancel', function() {
                this.classList.remove('active-anim');
            }, {passive: true});
        });
    </script>
