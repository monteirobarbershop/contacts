<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monteiro Barbershop | Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* Estilo Geral - Black Style */
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a; /* Fundo Preto */
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Header / Logo */
        header {
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: 4rem;
            margin: 0;
            letter-spacing: 4px;
            color: #d4af37; /* Um toque de dourado opaco para sofisticação */
        }

        p.subtitle {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-top: -10px;
            color: #888;
        }

        /* Botões */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: block;
            padding: 18px 20px;
            text-decoration: none;
            color: #ffffff;
            background-color: transparent;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        /* Efeito de Hover */
        .btn:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
            transform: translateY(-2px);
        }

        /* Destaque para o botão de Marcações */
        .btn-booking {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .btn-booking:hover {
            background-color: #d4af37;
            border-color: #d4af37;
        }

        /* Footer */
        footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #444;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>MONTEIRO</h1>
            <p class="subtitle">Barbershop</p>
        </header>

        <div class="links-container">
            <a href="https://www.google.com/maps/search/?api=1&query=Praça+Jaime+Afreixo+5,+3870-211+Murtosa" target="_blank" class="btn">
                WhatsApp / Contacto
            </a>

            <a href="https://noona.app/monteirobarbershop" target="_blank" class="btn btn-booking">
                Fazer Marcação
            </a>

            <a href="https://www.google.com/maps/search/?api=1&query=Pra%C3%A7a%20Alm.%20Jaime%20Afreixo%205%20RC%203870-211%20Murtosa" target="_blank" class="btn">
                Ver no Mapa / Direções
            </a>
        </div>

        <footer>
            &copy; 2024 Monteiro Barbershop
        </footer>
    </div>

</body>
</html>
